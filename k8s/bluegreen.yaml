apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      color: blue
  template:
    metadata:
      labels:
        app: aceest-bg
        color: blue
    spec:
      containers:
      - name: aceest
        image: rishi0611ui/aceest-fitness:v1
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "1.0.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      color: green
  template:
    metadata:
      labels:
        app: aceest-bg
        color: green
    spec:
      containers:
      - name: aceest
        image: rishi0611ui/aceest-fitness:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "2.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bg-svc
spec:
  type: NodePort
  selector:
    app: aceest-bg
    color: blue
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30082
