apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-ab
      variant: a
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: a
    spec:
      containers:
      - name: aceest
        image: rishi0611ui/aceest-fitness:v1
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "1.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-a-svc
spec:
  type: NodePort
  selector:
    app: aceest-ab
    variant: a
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30086
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-ab
      variant: b
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: b
    spec:
      containers:
      - name: aceest
        image: rishi0611ui/aceest-fitness:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "2.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-b-svc
spec:
  type: NodePort
  selector:
    app: aceest-ab
    variant: b
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30087
