apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-canary
      version: stable
  template:
    metadata:
      labels:
        app: aceest-canary
        version: stable
    spec:
      containers:
      - name: aceest
        image: rishi0611ui/aceest-fitness:v1
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "1.0.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-new
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      version: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        version: canary
    spec:
      containers:
      - name: aceest
        image: rishi0611ui/aceest-fitness:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "2.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-svc
spec:
  type: NodePort
  selector:
    app: aceest-canary
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30083
