apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-main
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-main
  template:
    metadata:
      labels:
        app: aceest-main
    spec:
      containers:
      - name: aceest
        image: rishi0611ui/aceest-fitness:v1
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "1.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-main-svc
spec:
  type: NodePort
  selector:
    app: aceest-main
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
    spec:
      containers:
      - name: aceest
        image: rishi0611ui/aceest-fitness:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "2.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-svc
spec:
  type: NodePort
  selector:
    app: aceest-shadow
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30085
